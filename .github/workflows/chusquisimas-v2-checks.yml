name: Chusquisimas V2 checks

on:
  push:
    branches: [feature/chusquisimas-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Validate local SQLite schema and initial catalog
        run: python3 tests/integration/check_sqlite_schema.py
      - name: Check audited admin transactions
        run: python3 tests/integration/check_admin_transactions.py
      - name: Check deployment isolation
        run: python3 tests/integration/check_deployment_gate.py
      - name: Build
        run: npm run build
