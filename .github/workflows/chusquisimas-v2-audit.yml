name: Chusquisimas V2 dependency audit

on:
  push:
    branches: [feature/chusquisimas-v2]
    paths: ["v2/package.json", "v2/package-lock.json", ".github/workflows/chusquisimas-v2-audit.yml", "v2/scripts/audit-report.mjs"]
  schedule:
    - cron: "0 13 * * 1" # lunes 8:00 a. m. Bogotá
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: npm audit (todas las dependencias y solo producción)
        run: |
          npm audit --json > audit-full.json || true
          npm audit --omit=dev --json > audit-prod.json || true
      - name: Reporte (falla solo con altas o críticas en producción)
        run: node scripts/audit-report.mjs audit-full.json audit-prod.json
